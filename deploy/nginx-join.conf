# nginx server block —— join.campuslink.vip
#
# 安全响应头（CSP / nosniff / HSTS 等）全部由 Node 发出，nginx 默认透传。
# 放在应用里才能被单元测试断言，也避免两处配置漂移。
#
# 部署顺序（避免鸡生蛋）：
#   1. 先只加下面第一个 server（80 + ACME 验证），不要加 443 block
#   2. certbot 扩展证书（HTTP-01 走 80）
#   3. 再加 443 block
#   4. nginx -t && nginx -s reload

# ---- 阶段一：80 端口 + ACME 验证 ----
server {
    listen 80;
    listen [::]:80;
    server_name join.campuslink.vip;

    # certbot HTTP-01 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 阶段二：443（证书扩展成功后再启用）----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1 语法；旧版用 "listen 443 ssl http2;"
    server_name join.campuslink.vip;

    # 证书 lineage 目录名以 certbot 第一个 -d 为准，扩展后仍是 campuslink.vip
    ssl_certificate     /etc/letsencrypt/live/campuslink.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuslink.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 与应用侧 BODY_LIMIT(64KB) 一致，做双重限制
    client_max_body_size 1m;

    location / {
        # recruit-app 是 docker-compose 里的 container_name，
        # 通过共享的 external network 解析
        proxy_pass            http://recruit-app:3001;
        proxy_http_version    1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
